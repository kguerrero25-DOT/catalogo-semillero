
@if (dataSource.data.length === 0) {
<p>No hay productos disponibles.</p>
} @else {

<div class="tabla-contenedor">

  <table mat-table [dataSource]="dataSource" class="tabla-productos">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let producto">
        {{ producto.id }}
      </td>
    </ng-container>

    <ng-container matColumnDef="imagen">
      <th mat-header-cell *matHeaderCellDef>Miniatura</th>
      <td mat-cell *matCellDef="let producto">
        <img
          class="miniatura"
          [src]="producto.images[0]"
          [alt]="'Imagen de ' + producto.title">
      </td>
    </ng-container>

    <ng-container matColumnDef="titulo">
      <th mat-header-cell *matHeaderCellDef>Título</th>
      <td mat-cell *matCellDef="let producto">
        {{ producto.title }}
      </td>
    </ng-container>

    <ng-container matColumnDef="categoria">
      <th mat-header-cell *matHeaderCellDef>Categoría</th>
      <td mat-cell *matCellDef="let producto">
        {{ producto.category.name }}
      </td>
    </ng-container>

    <ng-container matColumnDef="precio">
      <th mat-header-cell *matHeaderCellDef>Precio</th>
      <td mat-cell *matCellDef="let producto">
        {{ producto.price }}
      </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let producto">

        <div class="acciones">
          <button
            mat-icon-button
            type="button"
            aria-label="Editar producto"
            (click)="editar.emit(producto)">
            <mat-icon>edit</mat-icon>
          </button>

          <button
            mat-icon-button
            type="button"
            aria-label="Eliminar producto"
            (click)="eliminar.emit(producto)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>

      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let fila; columns: columnas"></tr>

  </table>

</div>

<mat-paginator
  [pageSize]="5"
  [pageSizeOptions]="[5, 10, 20]"
  showFirstLastButtons
  aria-label="Seleccionar página de productos">
</mat-paginator>

}
