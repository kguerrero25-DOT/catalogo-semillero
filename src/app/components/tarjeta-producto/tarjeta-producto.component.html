

<div>
  <img [src]= "producto.images[0]">
  <h2> {{producto.title}}</h2>
  <p>{{producto.price}}</p>
  <p>{{producto.category.name}}</p>

  <span *ngIf="producto.stock === 0 ">Agotado</span>

  <button
    (click)="agregarAlCarrito.emit(producto)"
    [disabled]="producto.stock === 0">
    Agregar al carrito
  </button>


</div>
