
<mat-card class="tarjeta-producto">

  <img
    mat-card-image
    [src]="producto.images[0]"
    [alt]="'Imagen de ' + producto.title"
    class="imagen-producto">

  <mat-card-header>
    <mat-card-title>
      {{ producto.title }}
    </mat-card-title>

    <mat-card-subtitle>
      {{ producto.category.name }}
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p class="precio">
      {{ producto.price | currency:'USD':'symbol':'1.2-2' }}
    </p>

    @if (producto.stock === 0) {
    <p class="agotado" role="status">
      Producto agotado
    </p>
    }
  </mat-card-content>

  <mat-card-actions>
    <button
      mat-flat-button
      color="primary"
      type="button"
      [disabled]="producto.stock === 0"
      (click)="agregarAlCarrito.emit(producto)">

      <mat-icon>shopping_cart</mat-icon>

      Agregar al carrito
    </button>
  </mat-card-actions>

</mat-card>
