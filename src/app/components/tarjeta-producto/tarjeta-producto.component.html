
<mat-card class="tarjeta-producto">
  <mat-card-header>
    <mat-card-title>
      {{ producto.titulo }}
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <p class="precio">
      {{ producto.precio | currency:'USD':'symbol':'1.2-2' }}
    </p>
  </mat-card-content>

  <mat-card-actions>
    <button
      mat-flat-button
      color="primary"
      type="button"
      (click)="agregarAlCarrito.emit(producto)">

      <mat-icon>shopping_cart</mat-icon>

      Agregar al carrito
    </button>
  </mat-card-actions>

</mat-card>
